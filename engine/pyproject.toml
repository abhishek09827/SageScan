[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sagescan-engine"
version = "1.0.0"
description = "Python validation engine for SageScan data quality tool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "SageScan", email = "sagescan@example.com" }
]
keywords = ["data-quality", "validation", "data-engineering", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pydantic>=2.4.0",
    "PyYAML>=6.0.1",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
parquet = [
    "pyarrow>=14.0.0",
]
llm = [
    "openai>=1.0.0",
    "litellm>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyarrow>=14.0.0",
]
all = [
    "pyarrow>=14.0.0",
    "openai>=1.0.0",
    "litellm>=1.0.0",
]

[project.scripts]
sagescan-engine = "sagescan_engine.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sagescan_engine*"]

[tool.pytest.ini_options]
testpaths = ["sagescan_engine"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
