version: "1.0"
context: ""
metadata:
  author: SageScan
  created_at: "2024-01-01"
  description: Default SageScan configuration

source:
  type: csv
  path: data/sample.csv

rules:
  - column: id
    checks:
      - type: not_null
      - type: unique

  - column: name
    checks:
      - type: not_null
      - type: min_length
        value: 1

  - column: email
    checks:
      - type: not_null
      - type: regex
        value: "^[^@]+@[^@]+\\.[^@]+$"
